name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
        env:
          MATCHMAKING_URL: ${{ vars.MATCHMAKING_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        id: artifact
        with:
          path: dist
      - name: Deploy to Pages
        id: pages
        uses: actions/github-script@v9.0.0
        timeout-minutes: 11
        env:
          PAGES_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        with:
          script: |
            // Submit the uploaded artifact directly. The runner's name lookup can lag behind upload.
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId < 1) {
              throw new Error("The upload did not return a valid Pages artifact ID.");
            }

            const route = "/repos/{owner}/{repo}/pages/deployments";
            const { data: deployment } = await github.request(`POST ${route}`, {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: await core.getIDToken(),
            });
            const deploymentId = deployment.id ?? context.sha;
            const params = { ...context.repo, pages_deployment_id: deploymentId };
            const statusRoute = `${route}/{pages_deployment_id}`;
            core.info(`Started Pages deployment ${deploymentId} using artifact ${artifactId}.`);

            let pending = true;
            let cancellation;
            const cancel = () => {
              if (pending) {
                pending = false;
                cancellation = github.request(`POST ${statusRoute}/cancel`, params).catch((error) => {
                  core.warning(`Could not cancel Pages deployment ${deploymentId}. ${error.message}`);
                });
              }
              return cancellation;
            };
            process.once("SIGINT", cancel);
            process.once("SIGTERM", cancel);
            const failures = new Set([
              "deployment_failed", "deployment_perms_error", "deployment_content_failed",
              "deployment_cancelled", "deployment_lost",
            ]);
            try {
              const deadline = Date.now() + 600_000;
              while (pending && Date.now() < deadline) {
                await new Promise((resolve) => setTimeout(resolve, 5000));
                if (!pending) break;
                let status;
                try {
                  const { data } = await github.request(`GET ${statusRoute}`, params);
                  status = data.status;
                } catch (error) {
                  if (error.status !== 404 && error.status !== 429 && !(error.status >= 500)) throw error;
                  core.warning(`Pages status request returned HTTP ${error.status}. Retrying.`);
                  continue;
                }
                if (!pending) break;
                if (status === "succeed") {
                  pending = false;
                  core.setOutput("page_url", deployment.page_url);
                  core.info(`Pages deployment succeeded at ${deployment.page_url}.`);
                  return;
                }
                if (failures.has(status)) {
                  pending = false;
                  throw new Error(`Pages deployment ${deploymentId} ended with status ${status}.`);
                }
              }
              throw new Error(pending ? "Timed out waiting for GitHub Pages." : "Pages deployment was cancelled.");
            } finally {
              process.removeListener("SIGINT", cancel);
              process.removeListener("SIGTERM", cancel);
              await cancel();
            }
